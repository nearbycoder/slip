# Flatpak manifest for Slip.
#
#   flatpak install flathub org.gnome.Platform//47 org.gnome.Sdk//47 \
#       org.freedesktop.Sdk.Extension.rust-stable//24.08
#   flatpak-builder --user --install --force-clean build-dir linux/data/io.github.nearbycoder.Slip.yml
#   flatpak run io.github.nearbycoder.Slip
#
# Run from the repository root. Cargo fetches crates during the build (build-args
# --share=network). For Flathub, replace that with an offline `cargo-sources.json`
# generated by flatpak-builder-tools' flatpak-cargo-generator.py from linux/Cargo.lock.
app-id: io.github.nearbycoder.Slip
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: slip
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Default save location; other folders go through the file chooser portal.
  - --filesystem=xdg-download
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/slip/cargo
    CARGO_NET_OFFLINE: "false"
modules:
  - name: slip
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked --manifest-path linux/Cargo.toml -p slip-gtk
      - install -Dm755 linux/target/release/slip -t /app/bin/
      - install -Dm644 linux/data/io.github.nearbycoder.Slip.desktop -t /app/share/applications/
      - install -Dm644 linux/data/io.github.nearbycoder.Slip.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 linux/data/icons/hicolor/scalable/apps/io.github.nearbycoder.Slip.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: dir
        path: ../..
        skip:
          - linux/target
          - linux/build-dir
          - linux/.flatpak-builder
